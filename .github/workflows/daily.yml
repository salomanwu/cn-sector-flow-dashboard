name: 每日盘后资金流

on:
  schedule:
    - cron: '17 10 * * 1-5'   # UTC 10:17 = 北京 18:17，周一至周五
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装依赖
        run: python -m pip install --quiet akshare pandas
      - name: 生成看板
        run: python scripts/build_dashboard.py
      - name: 提交
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git diff --staged --quiet || (git commit -m "chore: daily fund flow $(date -u +%F)" && git push)
